<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Můj Vlastní Video Přehrávač</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
    #player-container { flex: 2; }
    video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px; }
    #playlist { flex: 1; background: #1e1e1e; padding: 15px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    .video-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
    .video-item:hover { background: #333; }
  </style>
</head>
<body>

  <div id="player-container">
    <video id="mainPlayer" controls autoplay></video>
    <h2 id="videoTitle">Vyber video ze seznamu</h2>
  </div>

  <div id="playlist">
    <h3>Moje Videa</h3>
    <div id="videoList">Načítám...</div>
  </div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

  const SUPABASE_URL = 'https://uiwwtruinrgdpvtiott.supabase.co'
  const SUPABASE_KEY = 'TVUJ_PUBLISHABLE_NEBO_ANON_KLIC' // Doplň svůj klíč

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

  async function nactiAVytahniKlip() {
    // 1. Získat seznam souborů z bucketu 'videa'
    const { data: soubory, error } = await supabase
      .storage
      .from('videa')
      .list()

    if (error) {
      console.error('Chyba při načítání ze Supabase:', error)
      return
    }

    // 2. Vyfiltrujeme případné systémové složky
    const videa = soubory.filter(file => file.name !== '.emptyFolderPlaceholder')

    if (videa.length > 0) {
      // Vezmeme první dostupné video (v tvém případě "1p (1).mp4")
      const prvniVideo = videa[0].name

      // 3. Vygenerujeme přímou veřejnou URL adresu pro video
      const { data: urlData } = supabase
        .storage
        .from('videa')
        .getPublicUrl(prvniVideo)

      // 4. Vložíme URL přímo do <video> přehrávače na stránce
      const prehravac = document.getElementById('mainPlayer') // podle ID tvého <video> tagu
      if (prehravac) {
        prehravac.src = urlData.publicUrl
        console.log('Klip úspěšně načten:', urlData.publicUrl)
      }
    }
  }

  // Spustit automaticky po načtení stránky
  nactiAVytahniKlip()
</script>
</body>
</html>
