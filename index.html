<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Style Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Roboto", Arial, sans-serif; }
    body { background-color: #0f0f0f; color: #f1f1f1; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .player-card {
      background-color: #0f0f0f;
      width: 100%;
      max-width: 1280px;
      height: 85vh;
      display: flex;
      flex-direction: column;
    }

    /* 1. VYHLEDÁVÁNÍ ODSTRANĚNO - ČISTÁ LIŠTA */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-shrink: 0; }
    .header-title { font-size: 18px; font-weight: bold; color: #fff; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; gap: 12px; align-items: center; }

    .upload-btn { background: #ff0000; color: #fff; border: none; padding: 8px 16px; border-radius: 18px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .upload-btn:hover { background: #cc0000; }

    .mode-switch { display: flex; gap: 4px; background: #272727; padding: 4px; border-radius: 18px; }
    .mode-btn { background: transparent; border: none; color: #aaa; padding: 6px 14px; border-radius: 14px; font-size: 12px; font-weight: 500; cursor: pointer; }
    .mode-btn.active { background: #f1f1f1; color: #0f0f0f; font-weight: bold; }

    /* LAYOUT */
    .content-grid { display: flex; gap: 20px; flex-grow: 1; min-height: 0; }
    .player-section { flex: 2; display: flex; flex-direction: column; min-height: 0; }
    .playlist-section { flex: 1; min-width: 320px; max-width: 400px; display: flex; flex-direction: column; min-height: 0; background: #181818; padding: 16px; border-radius: 12px; }

    /* 3. ODDĚLENÝ PANEL PRO MP3 A VIDEO */
    .media-box { width: 100%; flex-grow: 1; background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 12px; min-height: 0; position: relative; }
    video { width: 100%; height: 100%; object-fit: contain; }
    
    .audio-card { display: none; width: 100%; height: 100%; background: linear-gradient(135deg, #1f1c2c, #928dab); flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; }
    .audio-disc { width: 120px; height: 120px; border-radius: 50%; background: #0f0f0f; border: 4px solid #ff0000; display: flex; justify-content: center; align-items: center; font-size: 45px; margin-bottom: 12px; animation: spin 4s linear infinite; animation-play-state: paused; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .audio-only video { display: none; }
    .audio-only .audio-card { display: flex; }

    .track-info { margin-bottom: 10px; flex-shrink: 0; }
    .track-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 13px; color: #aaa; }

    /* 2. PLNOHODNOTNÉ OVLÁDÁNÍ */
    .controls-bar { background: #181818; padding: 12px 16px; border-radius: 12px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    
    .progress-container { display: flex; align-items: center; gap: 12px; }
    .time-display { font-size: 12px; color: #aaa; font-variant-numeric: tabular-nums; min-width: 38px; text-align: center; }
    .progress-bar { flex-grow: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; background: #444; outline: none; cursor: pointer; }
    .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff0000; cursor: pointer; }

    .buttons-row { display: flex; justify-content: space-between; align-items: center; }
    .left-controls, .right-controls { display: flex; align-items: center; gap: 16px; }
    .btn-play { width: 42px; height: 42px; border-radius: 50%; background: #ff0000; border: none; font-size: 16px; cursor: pointer; color: #fff; display: flex; justify-content: center; align-items: center; }
    .btn-icon { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; opacity: 0.8; }
    .btn-icon:hover { opacity: 1; }
    
    .volume-box { display: flex; align-items: center; gap: 8px; }
    .volume-bar { width: 80px; -webkit-appearance: none; appearance: none; height: 4px; background: #444; border-radius: 2px; outline: none; cursor: pointer; }
    .volume-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; }

    /* PLAYLIST */
    .playlist-title { font-size: 15px; font-weight: bold; color: #f1f1f1; margin-bottom: 12px; flex-shrink: 0; }
    .playlist-items { overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; }
    .playlist-items::-webkit-scrollbar { width: 6px; }
    .playlist-items::-webkit-scrollbar-thumb { background: #373737; border-radius: 4px; }

    .yt-card { display: flex; gap: 10px; padding: 6px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    .yt-card:hover { background: #272727; }
    .yt-card.active { background: #272727; border-left: 3px solid #ff0000; }

    .yt-thumb-wrapper { position: relative; width: 120px; height: 68px; border-radius: 8px; overflow: hidden; background: #000; flex-shrink: 0; }
    .yt-thumb-img { width: 100%; height: 100%; object-fit: cover; }
    .yt-duration { position: absolute; bottom: 4px; right: 4px; background: rgba(0, 0, 0, 0.8); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 4px; }

    .yt-details { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .yt-title { font-size: 13px; font-weight: 500; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .yt-channel { font-size: 11px; color: #aaa; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="player-card" id="playerCard">
    <div class="header">
      <div class="header-title"><span style="color: #ff0000;">▶</span> Můj Přehravač</div>
      <div class="header-right">
        <button class="upload-btn" onclick="document.getElementById('fileInput').click()">+ Nahrát soubory</button>
        <input type="file" id="fileInput" accept="video/*,audio/*" multiple style="display: none;" onchange="handleFilesUpload(event)">
        
        <div class="mode-switch">
          <button class="mode-btn active" id="btnMp4" onclick="setMode('mp4')">MP4 Video</button>
          <button class="mode-btn" id="btnMp3" onclick="setMode('mp3')">MP3 Audio</button>
        </div>
      </div>
    </div>

    <div class="content-grid">
      <div class="player-section">
        <div class="media-box">
          <video id="myVideo"></video>
          <div class="audio-card">
            <div class="audio-disc" id="audioDisc">🎵</div>
            <div style="font-size: 14px; font-weight: bold; color: #fff;" id="audioTrackTitle">Audio Režim</div>
          </div>
        </div>

        <div class="track-info">
          <div class="track-title" id="trackTitle">Vyberte soubory tlačítkem "+ Nahrát soubory"</div>
          <div class="track-artist" id="trackArtist">Lokální Knihovna</div>
        </div>

        <div class="controls-bar">
          <div class="progress-container">
            <span class="time-display" id="currentTime">0:00</span>
            <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
            <span class="time-display" id="duration">0:00</span>
          </div>

          <div class="buttons-row">
            <div class="left-controls">
              <button class="btn-icon" onclick="playPrev()">⏮</button>
              <button class="btn-play" id="btnPlay" onclick="playPause()">▶</button>
              <button class="btn-icon" onclick="playNext()">⏭</button>
              
              <div class="volume-box">
                <button class="btn-icon" style="font-size: 16px;" onclick="toggleMute()">🔊</button>
                <input type="range" class="volume-bar" id="volumeBar" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
              </div>
            </div>

            <div class="right-controls">
              <button class="btn-icon" onclick="toggleFullscreen()">⛶</button>
            </div>
          </div>
        </div>
      </div>

      <div class="playlist-section">
        <div class="playlist-title">Seznam skladeb / videí</div>
        <div class="playlist-items" id="playlistContainer">
          <div style="color: #aaa; font-size: 12px; text-align: center; margin-top: 20px;">Žádné soubory v seznamu</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let currentIndex = -1;

    const video = document.getElementById('myVideo');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const btnPlay = document.getElementById('btnPlay');
    const audioDisc = document.getElementById('audioDisc');

    video.addEventListener('timeupdate', () => {
      if (!isNaN(video.duration) && video.duration > 0) {
        const progress = (video.currentTime / video.duration) * 100;
        progressBar.value = progress;
        currentTimeEl.textContent = formatTime(video.currentTime);
        durationEl.textContent = formatTime(video.duration);
      }
    });

    progressBar.addEventListener('input', () => {
      if (!isNaN(video.duration) && video.duration > 0) {
        video.currentTime = (progressBar.value / 100) * video.duration;
      }
    });

    video.addEventListener('ended', playNext);

    async function handleFilesUpload(event) {
      const files = Array.from(event.target.files);
      if (files.length === 0) return;

      for (const file of files) {
        const fileURL = URL.createObjectURL(file);
        const isAudio = file.type.startsWith('audio');
        const { thumb, duration } = isAudio ? { thumb: '', duration: 'Audio' } : await extractVideoData(fileURL);
        
        playlist.push({
          title: file.name.replace(/\.[^/.]+$/, ""),
          url: fileURL,
          thumb: thumb,
          duration: duration,
          type: isAudio ? 'mp3' : 'mp4'
        });
      }

      renderPlaylist();
      if (currentIndex === -1 && playlist.length > 0) {
        loadTrack(0);
      }
    }

    function extractVideoData(videoUrl) {
      return new Promise((resolve) => {
        const tempVideo = document.createElement('video');
        tempVideo.src = videoUrl;
        tempVideo.currentTime = 1;
        tempVideo.muted = true;
        
        tempVideo.onloadedmetadata = () => {
          const durationFormatted = formatTime(tempVideo.duration);
          tempVideo.onseeked = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 90;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
            resolve({ thumb: canvas.toDataURL(), duration: durationFormatted });
          };
        };
        tempVideo.onerror = () => resolve({ thumb: '', duration: '0:00' });
      });
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';

      playlist.forEach((track, index) => {
        const card = document.createElement('div');
        card.className = `yt-card ${index === currentIndex ? 'active' : ''}`;
        card.onclick = () => loadTrack(index);

        const thumbHtml = track.thumb 
          ? `<img class="yt-thumb-img" src="${track.thumb}">`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#272727;font-size:24px;">🎵</div>`;

        card.innerHTML = `
          <div class="yt-thumb-wrapper">
            ${thumbHtml}
            <span class="yt-duration">${track.duration}</span>
          </div>
          <div class="yt-details">
            <div class="yt-title">${track.title}</div>
            <div class="yt-channel">${track.type.toUpperCase()} Soubor</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function loadTrack(index) {
      if (index < 0 || index >= playlist.length) return;
      
      currentIndex = index;
      const track = playlist[currentIndex];
      
      video.src = track.url;
      document.getElementById('trackTitle').textContent = track.title;
      document.getElementById('audioTrackTitle').textContent = track.title;
      
      setMode(track.type);
      video.play();
      btnPlay.textContent = '⏸';
      audioDisc.style.animationPlayState = 'running';
      
      renderPlaylist();
    }

    function playPause() {
      if (!video.src) return;

      if (video.paused) {
        video.play();
        btnPlay.textContent = '⏸';
        audioDisc.style.animationPlayState = 'running';
      } else {
        video.pause();
        btnPlay.textContent = '▶';
        audioDisc.style.animationPlayState = 'paused';
      }
    }

    function playNext() {
      if (playlist.length === 0) return;
      loadTrack((currentIndex + 1) % playlist.length);
    }

    function playPrev() {
      if (playlist.length === 0) return;
      loadTrack((currentIndex - 1 + playlist.length) % playlist.length);
    }

    function setVolume(val) {
      video.volume = val;
    }

    function toggleMute() {
      video.muted = !video.muted;
    }

    function toggleFullscreen() {
      if (video.requestFullscreen) video.requestFullscreen();
    }

    function setMode(mode) {
      const card = document.getElementById('playerCard');
      const btnMp4 = document.getElementById('btnMp4');
      const btnMp3 = document.getElementById('btnMp3');

      if (mode === 'mp3') {
        card.classList.add('audio-only');
        btnMp3.classList.add('active');
        btnMp4.classList.remove('active');
      } else {
        card.classList.remove('audio-only');
        btnMp4.classList.add('active');
        btnMp3.classList.remove('active');
      }
    }
  </script>

</body>
</html>
