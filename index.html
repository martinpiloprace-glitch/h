<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Můj Vlastní Video Přehrávač</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; display: flex; gap: 20px; padding: 20px; }
    #player-container { flex: 2; }
    video { width: 100%; max-height: 80vh; background: #000; border-radius: 8px; }
    #playlist { flex: 1; background: #1e1e1e; padding: 15px; border-radius: 8px; max-height: 80vh; overflow-y: auto; }
    .video-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; }
    .video-item:hover { background: #333; }
  </style>
</head>
<body>

  <div id="player-container">
    <video id="mainPlayer" controls autoplay></video>
    <h2 id="videoTitle">Vyber video ze seznamu</h2>
  </div>

  <div id="playlist">
    <h3>Moje Videa</h3>
    <div id="videoList">Načítám...</div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const SUPABASE_URL = 'https://uiwwtruinrgdpvtiott.supabase.co'
    // Použij svůj klíč ze Supabase
    const SUPABASE_KEY = 'sb_publishable_ekDiPiW4YGpmP3tWDpSokg_UIzML...' 

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    async function loadVideos() {
      // Načtení seznamu souborů z bucketu 'videa'
      const { data, error } = await supabase.storage.from('videa').list()

      if (error) {
        console.error('Chyba načítání:', error)
        document.getElementById('videoList').innerText = 'Chyba při načítání videí.'
        return
      }

      const listContainer = document.getElementById('videoList')
      listContainer.innerHTML = ''

      data.forEach(file => {
        // Ignorujeme složky nebo systémové soubory
        if (file.name === '.emptyFolderPlaceholder') return

        const item = document.createElement('div')
        item.className = 'video-item'
        item.innerText = file.name

        item.onclick = () => {
          // Získání veřejné URL adresy konkrétního videa
          const { data: urlData } = supabase.storage.from('videa').getPublicUrl(file.name)
          const player = document.getElementById('mainPlayer')
          player.src = urlData.publicUrl
          document.getElementById('videoTitle').innerText = file.name
        }

        listContainer.appendChild(item)
      })
    }

    loadVideos()
  </script>
</body>
</html>
